<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen — Branch Team Tool</title>
<link rel="icon" href="/images/Ontwerp zonder titel-3.png" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --branch-blue-dark: #032F8A; --branch-blue: #0B6DFF; --branch-green: #78DB55; --ink: #05070F; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F7F7F7; color: #111827; }
  main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { width: 100%; max-width: 380px; padding: 40px 32px; border-radius: 16px; background: rgba(255,255,255,0.9); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 8px 32px rgba(3,47,138,0.08); }
  .logo { display: block; text-align: center; font-weight: 900; font-size: 1.6rem; letter-spacing: -0.02em; text-decoration: none; margin-bottom: 24px; background: linear-gradient(90deg, #032F8A, #0BDDFF, #14B8E6, #78DB55); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  h1 { font-size: 1.15rem; font-weight: 700; text-align: center; margin: 0 0 24px; color: var(--ink); }
  label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-top: 16px; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; }
  button { margin-top: 24px; width: 100%; background: var(--branch-blue-dark); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; }
  button:hover { background: var(--branch-blue); }
  .error { color: #dc2626; font-size: 13px; margin-top: 16px; display: none; }
</style>
</head>
<body>
  <main>
    <div class="card">
      <a href="/" class="logo" translate="no">Branch</a>
      <h1>Team Tool — Inloggen</h1>
      <form id="login-form" method="post" action="/portal/login">
        <label for="email">E-mailadres</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Wachtwoord</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div class="error" id="error">Onjuist e-mailadres of wachtwoord.</div>
        <button type="submit">Inloggen</button>
      </form>
    </div>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error");
      errorEl.style.display = "none";

      const response = await fetch("/portal/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });

      if (response.ok) {
        window.location.href = "/portal";
      } else {
        errorEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
