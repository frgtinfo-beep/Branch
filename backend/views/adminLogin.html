<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login — Branch</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 360px; margin: 120px auto; padding: 0 20px; color: #111827; }
  h1 { font-size: 20px; }
  label { display: block; font-size: 13px; color: #374151; margin-top: 16px; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  button { margin-top: 24px; width: 100%; background: #003399; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
  .error { color: #dc2626; font-size: 14px; margin-top: 16px; display: none; }
</style>
</head>
<body>
  <h1>Branch admin</h1>
  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="error" id="error">Invalid username or password.</div>
    <button type="submit">Sign in</button>
  </form>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error");
      errorEl.style.display = "none";

      const response = await fetch("/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });

      if (response.ok) {
        window.location.href = "/admin";
      } else {
        errorEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
