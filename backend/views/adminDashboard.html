<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Branch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --branch-blue-dark: #032F8A;
    --branch-blue: #0B6DFF;
    --branch-cyan: #14B8E6;
    --branch-green: #78DB55;
    --background: #F7F7F7;
    --ink: #05070F;
    --text-dark: #111827;
    --text-light: #6B7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text-dark);
    background:
      radial-gradient(720px 420px at 8% -8%, rgba(11,109,255,0.10), transparent 60%),
      radial-gradient(640px 380px at 100% 0%, rgba(120,219,85,0.10), transparent 55%),
      var(--background);
    background-attachment: fixed;
  }

  .admin-nav { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.85); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border-bottom: 1px solid rgba(255,255,255,0.65); box-shadow: 0 8px 32px rgba(3,47,138,0.08); }
  .admin-nav::after { content: ''; display: block; height: 2px; background: linear-gradient(90deg, #032F8A, #0BDDFF, #14B8E6, #78DB55); opacity: 0.7; }
  .admin-nav-inner { max-width: 1080px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .admin-logo { font-weight: 900; font-size: 1.3rem; letter-spacing: -0.02em; text-decoration: none; background: linear-gradient(90deg, #032F8A, #0BDDFF, #14B8E6, #78DB55); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .admin-logo::after { content: 'Admin'; margin-left: 10px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-light); -webkit-text-fill-color: var(--text-light); }
  button.logout { background: none; border: 1px solid #d1d5db; border-radius: 8px; padding: 7px 14px; font-size: 0.8rem; font-weight: 600; color: var(--text-dark); cursor: pointer; font-family: inherit; transition: background 0.15s ease, border-color 0.15s ease; }
  button.logout:hover { background: #f3f4f6; border-color: #b8bfc9; }

  main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; animation: fade-in 0.35s ease both; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h2.section-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 18px; color: var(--ink); position: relative; padding-left: 14px; }
  h2.section-title::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 4px; border-radius: 4px; background: linear-gradient(180deg, var(--branch-blue), var(--branch-green)); }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat-card { border-radius: 14px; padding: 16px 18px; background: rgba(255,255,255,0.85); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 8px 32px rgba(3,47,138,0.06); border-top: 3px solid var(--branch-blue); }
  .stat-card.accent-green { border-top-color: var(--branch-green); }
  .stat-card.accent-indigo { border-top-color: #6366f1; }
  .stat-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-light); margin: 0 0 6px; }
  .stat-value { font-size: 1.6rem; font-weight: 800; color: var(--ink); margin: 0; letter-spacing: -0.01em; }

  .card { border-radius: 16px; background: rgba(255,255,255,0.85); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 8px 32px rgba(3,47,138,0.06); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 13px 18px; border-bottom: 1px solid rgba(229,231,235,0.8); font-size: 0.88rem; }
  th { color: var(--text-light); font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; background: rgba(247,247,247,0.6); }
  tbody tr:last-child td { border-bottom: none; }
  tr.client-row { cursor: pointer; transition: background 0.15s ease; }
  tr.client-row:hover { background: rgba(11,109,255,0.06); }
  .client-name { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--ink); }
  .client-avatar { width: 28px; height: 28px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--branch-blue), var(--branch-green)); }
  .money { font-weight: 700; font-variant-numeric: tabular-nums; }

  .status { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
  .status-active { background: #dcfce7; color: #166534; }
  .status-pending_customer_approval, .status-pending_submission, .status-submitted { background: #fef3c7; color: #92400e; }
  .status-failed, .status-cancelled, .status-no_mandate { background: #fee2e2; color: #991b1b; }
  .status-confirmed, .status-paid_out, .status-collecting { background: #dcfce7; color: #166534; }
  .status-collection_paused, .status-paused { background: #e0e7ff; color: #3730a3; }
  .status-none { background: #f3f4f6; color: #6b7280; }

  #history { display: none; margin-top: 28px; animation: fade-in 0.3s ease both; }
  #history .card-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid rgba(229,231,235,0.8); }
  #history-title { font-size: 0.95rem; font-weight: 700; color: var(--ink); margin: 0; }
  #close-history { background: none; border: none; color: var(--text-light); font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; padding: 4px 8px; border-radius: 6px; }
  #close-history:hover { background: #f3f4f6; color: var(--text-dark); }
  .empty-row td { text-align: center; color: var(--text-light); padding: 28px 18px; font-size: 0.85rem; }

  @media (prefers-reduced-motion: reduce) {
    main, #history { animation: none; }
  }
  @media (max-width: 640px) {
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tr.client-row, tbody tr { border-bottom: 1px solid rgba(229,231,235,0.8); padding: 10px 18px; }
    td { border-bottom: none; padding: 4px 0; }
    td::before { content: attr(data-label); display: block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-light); margin-bottom: 2px; }
  }
</style>
</head>
<body>
  <nav class="admin-nav">
    <div class="admin-nav-inner">
      <span class="admin-logo" translate="no">Branch</span>
      <button class="logout" id="logout">Log out</button>
    </div>
  </nav>

  <main>
    <h2 class="section-title">Clients</h2>

    <div class="stat-grid" id="stat-grid"></div>

    <div class="card">
      <table id="clients-table">
        <thead>
          <tr><th>Client</th><th>Mandate</th><th>Unbilled total</th><th>Currency</th></tr>
        </thead>
        <tbody id="clients-body"></tbody>
      </table>
    </div>

    <div id="history">
      <div class="card">
        <div class="card-header">
          <h3 id="history-title"></h3>
          <button id="close-history">Close ✕</button>
        </div>
        <table>
          <thead>
            <tr><th>Period</th><th>Transactions</th><th>Total</th><th>Status</th><th>GoCardless payment</th></tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]
      ));
    }

    function statusBadge(status) {
      const safe = escapeHtml(status);
      return '<span class="status status-' + safe + '">' + safe.replace(/_/g, " ") + '</span>';
    }

    function formatMoney(amount, currency) {
      return new Intl.NumberFormat("en-IE", { style: "currency", currency: currency || "EUR" }).format(amount);
    }

    function formatDate(value) {
      return value ? new Date(value).toLocaleDateString("en-IE") : "—";
    }

    function initials(name) {
      return String(name || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
    }

    function renderStats(clients) {
      const activeCount = clients.filter((c) => c.active).length;
      const pausedCount = clients.filter((c) => c.collection_paused).length;
      const totalUnbilled = clients.reduce((sum, c) => sum + (c.unbilled_total || 0), 0);
      const currency = clients[0] ? clients[0].currency : "EUR";

      document.getElementById("stat-grid").innerHTML =
        '<div class="stat-card"><p class="stat-label">Active clients</p><p class="stat-value">' + activeCount + '</p></div>' +
        '<div class="stat-card accent-green"><p class="stat-label">Unbilled total</p><p class="stat-value">' + formatMoney(totalUnbilled, currency) + '</p></div>' +
        '<div class="stat-card accent-indigo"><p class="stat-label">Collection paused</p><p class="stat-value">' + pausedCount + '</p></div>';
    }

    async function loadClients() {
      const response = await fetch("/api/admin/clients");
      if (response.status === 401) {
        window.location.href = "/admin/login";
        return;
      }
      const clients = await response.json();
      renderStats(clients);

      const body = document.getElementById("clients-body");
      body.innerHTML = "";

      if (clients.length === 0) {
        body.innerHTML = '<tr class="empty-row"><td colspan="4">No clients yet.</td></tr>';
        return;
      }

      clients.forEach((client) => {
        const row = document.createElement("tr");
        row.className = "client-row";
        row.dataset.clientId = client.client_id;
        row.innerHTML =
          '<td data-label="Client"><span class="client-name"><span class="client-avatar">' + escapeHtml(initials(client.name)) + '</span>' + escapeHtml(client.name) + '</span></td>' +
          '<td data-label="Mandate">' + statusBadge(client.mandate_status || "none") +
            (client.collection_paused ? " " + statusBadge("paused") : "") + "</td>" +
          '<td data-label="Unbilled total" class="money">' + formatMoney(client.unbilled_total, client.currency) + "</td>" +
          '<td data-label="Currency">' + escapeHtml(client.currency) + "</td>";
        row.addEventListener("click", () => loadHistory(client.client_id, client.name));
        body.appendChild(row);
      });
    }

    async function loadHistory(clientId, clientName) {
      const response = await fetch("/api/admin/clients/" + encodeURIComponent(clientId) + "/billing-runs");
      if (response.status === 401) {
        window.location.href = "/admin/login";
        return;
      }
      const runs = await response.json();
      document.getElementById("history-title").textContent = "Collection history — " + clientName;
      const body = document.getElementById("history-body");
      body.innerHTML = "";

      if (runs.length === 0) {
        body.innerHTML = '<tr class="empty-row"><td colspan="5">No billing runs recorded yet.</td></tr>';
      } else {
        runs.forEach((run) => {
          const row = document.createElement("tr");
          row.innerHTML =
            '<td data-label="Period">' + formatDate(run.period_start) + " – " + formatDate(run.period_end) + "</td>" +
            '<td data-label="Transactions">' + escapeHtml(run.transaction_count) + "</td>" +
            '<td data-label="Total" class="money">' + formatMoney(run.total_amount, run.currency) + "</td>" +
            '<td data-label="Status">' + statusBadge(run.status) + "</td>" +
            '<td data-label="GoCardless payment">' + escapeHtml(run.gocardless_payment_id || "—") + "</td>";
          body.appendChild(row);
        });
      }

      document.getElementById("history").style.display = "block";
      document.getElementById("history").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    document.getElementById("close-history").addEventListener("click", () => {
      document.getElementById("history").style.display = "none";
    });

    document.getElementById("logout").addEventListener("click", async () => {
      await fetch("/admin/logout", { method: "POST" });
      window.location.href = "/admin/login";
    });

    loadClients();
  </script>
</body>
</html>
